# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: gabrieldev.invoices
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:  
          - path: /V2
            url: https://services.odata.org
            destination: Northwind       
        #path: /V2
        #url: http://northwind.dest        
        # backend no necesario - usando URL directa en manifest.json
        # para evitar problema de session token de BAS: /(S(...))/northwind/...
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
          path: test/flpSandbox.html
          intent:
            object: gabrieldevinvoices
            action: display